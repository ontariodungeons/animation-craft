<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>agent harness</title></head>
<body>
<header class="bar">
  <div class="brand" id="brand" role="button" tabindex="0"><span id="project-name">Magic Studio</span></div>
  <button class="icon agent-toggle" id="agent-toggle" aria-label="Agent"></button>
</header>
<aside class="agent open" id="agent" aria-label="Agent" aria-hidden="false">
  <div class="agent-head">
    <span class="agent-title">Agent</span>
    <button class="icon" id="agent-new"></button><button id="agent-close" aria-label="Close the agent" title="Close">x</button>
  </div>
  <div class="agent-pickers">
    <select id="agent-target" aria-label="Send to" title="Send to"></select>
    <select id="agent-model" aria-label="Model" title="model"></select>
  </div>
  <div class="agent-log" id="agent-log" aria-live="polite"></div>
  <div class="agent-attachments" id="agent-attachments"></div>
  <div class="agent-compose">
    <textarea id="agent-input" rows="3" placeholder="Ask, point at something, or paste a picture…  (Ctrl+Enter sends)" aria-label="Message"></textarea>
    <div class="agent-actions">
      <button class="ghost" id="agent-point" title="Point"><span>Point</span></button>
      <span class="agent-status" id="agent-status"></span>
      <button class="start" id="agent-send">Send</button>
    </div>
    <button class="agent-watch" id="agent-watch" title="Copy"></button>
  </div>
</aside>
<div class="point-overlay" id="point-overlay"><div class="point-box" id="point-box"></div></div>
<div class="toast" id="toast" role="status"></div>
</body>
</html>
