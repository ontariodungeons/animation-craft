<!doctype html>
<html><head><meta charset="utf-8"><title>Theatre timeline</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#14171d;color:#ddd;font:12px system-ui}</style></head>
<body>
<script>
function reportTheatreError(error){document.body.dataset.error=String(error);parent.postMessage({magicTheatre:true,type:'error',error:String(error)},location.origin);}
addEventListener('error',event=>reportTheatreError(`${event.message}\n${event.error?.stack||''}`));
addEventListener('unhandledrejection',event=>reportTheatreError(event.reason?.stack||event.reason));
</script><script src="vendor/theatre.bundle.js"></script></body></html>
