[package]
name = "mc"
description = "Magic Studio CLI and MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "mc"
path = "src/main.rs"

[features]
default = []

[dependencies]
magicstudio-engine = { workspace = true }
serde_json = { workspace = true }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
