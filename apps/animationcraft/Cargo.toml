[package]
name = "animationcraft"
description = "AnimationCraft native Linux desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "animationcraft"

[lints]
workspace = true

[dependencies]
animationcraft-engine = { workspace = true }
animationcraft-ui-egui = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "inspection", "wayland", "x11"] }
serde_json = { workspace = true }
log = { workspace = true }
rfd = { workspace = true }

# Icon + VERSIONINFO for animationcraft.exe (build.rs); only needed when building on Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
