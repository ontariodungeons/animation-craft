[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
default-members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/omhas-animation"

[workspace.dependencies]
# internal
animationcraft-engine = { path = "crates/engine" }
animationcraft-ui-egui = { path = "crates/ui-egui" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"

# ui
craft-ui = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "5c874d51eeb3de70e735c8ce87a59a7dedd47675", features = ["serde"] }
egui = "0.37"
eframe = { version = "0.37", default-features = false }
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rayon = "1"
glam = "0.24"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
