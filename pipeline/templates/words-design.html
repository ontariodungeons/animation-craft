<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=__WIDTH__, height=__HEIGHT__" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
</head>
<body>
<!-- Derived by `mc exec words.compose` from the line designs in design/words.json; regenerate rather than hand-edit.
     Words are the artist's canonical text; times come from the video's lyric track. -->
<div data-composition-id="__COMPOSITION_ID__" data-width="__WIDTH__" data-height="__HEIGHT__" data-duration="__DURATION__" class="words-design">
  <style>
    [data-composition-id="__COMPOSITION_ID__"] { position: relative; width: __WIDTH__px; height: __HEIGHT__px; overflow: hidden; pointer-events: none; }
    [data-composition-id="__COMPOSITION_ID__"] .line { position: absolute; inset: 0; opacity: 0; }
    [data-composition-id="__COMPOSITION_ID__"] .it { position: absolute; white-space: nowrap; line-height: 1.05; }
    [data-composition-id="__COMPOSITION_ID__"] .it > span { display: inline-block; white-space: pre; transform-origin: 50% 100%; }
    [data-composition-id="__COMPOSITION_ID__"] .plain { position: absolute; left: 6%; right: 6%; bottom: 10%; display: flex; flex-wrap: wrap; justify-content: center; gap: 0 .3em; line-height: 1.1; }
    [data-composition-id="__COMPOSITION_ID__"] svg { position: absolute; overflow: visible; }
  </style>
  <script>
    (() => {
      // Found inside this composition's root, never the whole document; the runtime may run this detached.
      const root = document.currentScript?.closest("[data-composition-id]")
        || [...document.querySelectorAll('[data-composition-id="__COMPOSITION_ID__"]')].find((el) => el.classList.contains("words-design"));
      const DATA = __DATA__;
      const family = (font) => font === "serif" ? "serif" : font === "sans" ? "sans-serif" : (DATA.font ? `${JSON.stringify(DATA.font)}, sans-serif` : "sans-serif");
      const tl = gsap.timeline({ paused: true });
      for (const line of DATA.lines) {
        const box = document.createElement("div");
        box.className = "line";
        root.appendChild(box);
        // A line fades in just before its first word and out when the next line arrives.
        tl.to(box, { opacity: 1, duration: 0.4, ease: "power2.out" }, Math.max(0, line.start - 0.4));
        tl.to(box, { opacity: 0, duration: 0.3, ease: "power1.in" }, Math.max(line.start, line.end - 0.3));
        if (line.plain) {
          const row = document.createElement("div");
          row.className = "plain";
          Object.assign(row.style, { fontFamily: family("song"), fontSize: `${DATA.size}px`, color: DATA.color, fontWeight: "700" });
          row.textContent = line.text;
          box.appendChild(row);
          continue;
        }
        for (const d of line.draws) {
          const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.setAttribute("viewBox", d.view_box);
          Object.assign(svg.style, { left: `${d.x}px`, top: `${d.y}px`, width: `${d.w}px`, height: `${d.h}px` });
          for (const p of d.paths) {
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            for (const [k, v] of Object.entries({ d: p.d, pathLength: "1", fill: "none", stroke: p.stroke, "stroke-width": p.width, "stroke-linecap": "round", "stroke-linejoin": "round", "stroke-dasharray": "1", "stroke-dashoffset": "1" })) path.setAttribute(k, v);
            svg.appendChild(path);
            tl.to(path, { attr: { "stroke-dashoffset": 0 }, duration: Math.max(0.01, p.to - p.from), ease: "sine.inOut" }, line.start + p.from);
          }
          box.appendChild(svg);
        }
        for (const it of line.items) {
          const el = document.createElement("div");
          el.className = "it";
          Object.assign(el.style, { left: `${it.x}px`, top: `${it.y}px`, fontSize: `${it.size}px`, color: it.color, fontFamily: family(it.font),
            fontWeight: String(it.weight), fontStyle: it.italic ? "italic" : "normal", rotate: `${it.rotate}deg` });
          if (it.outline) Object.assign(el.style, { webkitTextStroke: `${it.size * 0.07}px ${it.outline}`, paintOrder: "stroke fill" });
          const a = it.accent;
          if (it.motion === "sleep") {
            [...it.text].forEach((ch, k) => {
              const s = document.createElement("span"); s.textContent = ch; el.appendChild(s);
              tl.to(s, { y: 7, rotation: -0.6, duration: 0.8, ease: "sine.inOut" }, a + k * 0.035);
            });
          } else {
            const s = document.createElement("span"); s.textContent = it.text; el.appendChild(s);
            const move = {
              settle: () => tl.to(s, { y: 6, scaleY: 0.965, duration: 0.65, ease: "power3.out" }, a),
              fall: () => tl.to(s, { y: 20, duration: 0.65, ease: "power3.out" }, a),
              pop: () => tl.to(s, { keyframes: [{ scale: 1.12, duration: 0.13 }, { scale: 1, duration: 0.3 }] }, a),
              rise: () => tl.to(s, { keyframes: [{ x: 12, y: -26, duration: 0.375, ease: "power1.out" }, { x: 24, y: -18, duration: 0.375, ease: "power1.in" }] }, a),
              east: () => tl.to(s, { x: 18, duration: 0.65, ease: "power3.out" }, a),
              west: () => tl.to(s, { x: -18, duration: 0.65, ease: "power3.out" }, a),
              loop: () => tl.to(s, { keyframes: [{ x: 12, y: -7 }, { x: 0, y: -14 }, { x: -12, y: -7 }, { x: 0, y: 0 }], duration: 0.75, ease: "none" }, a),
            }[it.motion];
            if (move) move();
          }
          box.appendChild(el);
        }
      }
      window.__timelines = window.__timelines || {};
      window.__timelines[DATA.composition_id] = tl;
    })();
  </script>
</div>
</body>
</html>
